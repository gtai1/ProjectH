<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hockey Hub - Stats</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Stats</h2>

    </section>

  <table class="stats-table">

    <thead> <tr> <th>Player</th> <th>Goals</th> <th>Post Goals</th> <th>Total Goals</th> </tr> </thead>
    
    <tbody id="stats-body"> <!-- Player stats will be inserted here --> </tbody>
    
  </table>

<div id="footer"></div>
    
</body>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

<script type="module" src="./js/main.js"></script>

</html>

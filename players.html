<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hockey Hub - Players</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Players</h2>

    </section>


    <!-- =========================
         Players
    ========================== -->
    <main class="players-container">

        <h3>Player Roster</h3>

        <div id="players-grid" class="players-grid"> <!-- Player cards will be generated here --> </div>

    </main>

    <div id="footer"></div>

</body>
    
<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

<script type="module" src="./js/main.js"></script>
    
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hockey Hub - Players</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Players</h2>

    </section>


    <!-- =========================
         Players
    ========================== -->
    <main class="players-container">

        <h3>Player Roster</h3>

        <div class="players-grid">


            <!-- Player 1 -->
            <article class="player-card">

                <div class="player-image">
                    #22
                </div>

                <div class="player-info">

                    <h4>Angus</h4>

                    <div class="player-position">
                        Defense
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>97</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>42</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


            <!-- Player 2 -->
            <article class="player-card">

                <div class="player-image">
                    #14
                </div>

                <div class="player-info">

                    <h4>Dom</h4>

                    <div class="player-position">
                        Right Wing
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>94</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>45</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


            <!-- Player 3 -->
            <article class="player-card">

                <div class="player-image">
                    #7
                </div>

                <div class="player-info">

                    <h4>Gavin</h4>

                    <div class="player-position">
                        Left Wing
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>88</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>34</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


            <!-- Player 4 -->
            <article class="player-card">

                <div class="player-image">
                    #24
                </div>

                <div class="player-info">

                    <h4>Ryan</h4>

                    <div class="player-position">
                        Center
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>91</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>40</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


        </div>

    </main>

    <div id="footer"></div>

</body>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>
    
</html>

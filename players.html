<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hockey Hub - Players</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Players</h2>

    </section>


    <!-- =========================
         Players
    ========================== -->
    <main class="players-container">

        <h3>Player Roster</h3>

        <div class="players-grid">


            <!-- Player 1 -->
            <article class="player-card">

                <div class="player-image">
                    #22
                </div>

                <div class="player-info">

                    <h4>Angus</h4>

                    <div class="player-position">
                        Defense
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>97</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>42</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


            <!-- Player 2 -->
            <article class="player-card">

                <div class="player-image">
                    #14
                </div>

                <div class="player-info">

                    <h4>Dom</h4>

                    <div class="player-position">
                        Right Wing
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>94</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>45</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


            <!-- Player 3 -->
            <article class="player-card">

                <div class="player-image">
                    #7
                </div>

                <div class="player-info">

                    <h4>Gavin</h4>

                    <div class="player-position">
                        Left Wing
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>88</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>34</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


            <!-- Player 4 -->
            <article class="player-card">

                <div class="player-image">
                    #24
                </div>

                <div class="player-info">

                    <h4>Ryan</h4>

                    <div class="player-position">
                        Center
                    </div>

                    <div class="player-stats">

                        <div class="stat">
                            <strong>91</strong>
                            <span>GP</span>
                        </div>

                        <div class="stat">
                            <strong>40</strong>
                            <span>G</span>
                        </div>

                    </div>

                </div>

            </article>


        </div>

        <div id="players-grid2" class="players-grid"> <!-- Player cards will be generated here --> </div>

    </main>

    <div id="footer"></div>

</body>
    
<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

<script type="module">
    async function loadPlayers() {
    try {
        // Load both JSON files const [playersResponse, gamesResponse] = await Promise.all([ fetch("./players.json"), fetch("./data.json") ]);

        if (!playersResponse.ok) {
        throw new Error("Unable to load players.json");
        }

        if (!gamesResponse.ok) {
        throw new Error("Unable to load data.json");
        }

        const players = await playersResponse.json();
        const games = await gamesResponse.json();

        const playersGrid = document.getElementById("players-grid2");

        // Create a card for each player players.forEach(player => {

        let gamesPlayed = 0;
        let goals = 0;

        // Find this player's stats across all games games.forEach(game => {

        const gamePlayer = game.players.find(
        (gamePlayer) => gamePlayer.name === player.name,
        );

        if (gamePlayer) {
        gamesPlayed++;

        // Regular goals + post goals goals += gamePlayer.goals + gamePlayer.postGoals;
        }

        // Create player card const card = document.createElement("article");

        card.classList.add("player-card");

        // Use image if one exists, // otherwise display the player's number const playerImage = player.image ? <img src="${player.image}" alt="${player.name}"> : <span>#${player.number}</span>;

        card.innerHTML = `

    <div class="player-image"> ${player.image} </div>

    <div class="player-info">

    <h4>${player.name}</h4>

    <div class="player-position"> ${player.position} </div>

    <div class="player-stats">

    <div class="stat"> <strong>${gamesPlayed}</strong> <span>GP</span> </div>

    <div class="stat"> <strong>${goals}</strong> <span>G</span> </div>

    </div>

    </div>

    `;

        playersGrid.appendChild(card);
    } catch (error) {
        console.error("Error loading players:", error);
    }
    }

    loadPlayers();
</script>
    
</html>

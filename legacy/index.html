<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hockey Hub - Stats</title>

    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Legacy Stats</h2>

    </section>

    <main class="players-container">

        <section class="stats-legacy-2026">
            <h3>2026 Season (January 10 - September 26)</h3>

            <div class="table-scroll">
                <table class="stats-table">     
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>GP</th>
                            <th>W</th>
                            <th>L</th>
                            <th>T</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>+/-</th>
                            <th>G</th>
                        </tr>
                    </thead>
            
                    <tbody id="stats-body-legacy-2026">
                        <!-- Player stats will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>
        
        <section class="stats-legacy-2025">
            <h3>2025 Season (August 16 - January 1)</h3>

            <div class="table-scroll">
                <table class="stats-table">     
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>GP</th>
                            <th>W</th>
                            <th>L</th>
                            <th>T</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>+/-</th>
                            <th>G</th>
                        </tr>
                    </thead>
            
                    <tbody id="stats-body-legacy-2025">
                        <!-- Player stats will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    
    <div id="footer"></div>
    
</body>

<script>
    fetch("../components/navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("../components/footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

<script type="module" src="../js/main.js"></script>

</html>

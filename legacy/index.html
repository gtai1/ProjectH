<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hockey Hub - Legacy Stats</title>

    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>

    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Legacy Stats</h2>

    </section>

    <!-- =========================
         Main Content
    ========================== -->
    <main class="players-container">

        <section class="stats-legacy-2026">
            <h3>2026 Season (Jan 10 - Sep 26)</h3>

            <div class="table-scroll">
                <table class="stats-table">     
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name">Player</th>
                            <th class="sortable" data-sort="gamesPlayed">GP</th>
                            <th class="sortable" data-sort="goals">G</th>
                            <th class="sortable" data-sort="wins">W</th>
                            <th class="sortable" data-sort="losses">L</th>
                            <th class="sortable" data-sort="ties">T</th>
                            <th class="sortable" data-sort="goalsFor">GF</th>
                            <th class="sortable" data-sort="goalsAgainst">GA</th>
                            <th class="sortable" data-sort="plusMinus">+/-</th>
                        </tr>
                    </thead>
            
                    <tbody id="stats-body-legacy-2026">
                        <!-- Player stats will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>
        
        <section class="stats-legacy-2025">
            <h3>2025 Season (Aug 16 - Jan 1)</h3>

            <div class="table-scroll">
                <table class="stats-table">     
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name">Player</th>
                            <th class="sortable" data-sort="gamesPlayed">GP</th>
                            <th class="sortable" data-sort="goals">G</th>
                            <th class="sortable" data-sort="wins">W</th>
                            <th class="sortable" data-sort="losses">L</th>
                            <th class="sortable" data-sort="ties">T</th>
                            <th class="sortable" data-sort="goalsFor">GF</th>
                            <th class="sortable" data-sort="goalsAgainst">GA</th>
                            <th class="sortable" data-sort="plusMinus">+/-</th>
                        </tr>
                    </thead>
            
                    <tbody id="stats-body-legacy-2025">
                        <!-- Player stats will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    
    <div id="footer"></div>
    
</body>

<script>
    fetch("../components/navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;

            const currentPath = window.location.pathname.replace(/\/+$/, "") || "/";

            document.querySelectorAll("#navbar nav a").forEach(link => {
                const linkPath = new URL(link.href).pathname.replace(/\/+$/, "") || "/";

                if (linkPath === currentPath) {
                    link.classList.add("active");
                }
            });
        });
</script>

<script>
    fetch("../components/footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

<script type="module" src="../js/main.js"></script>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hockey Hub - Home</title>
    
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         Hero Banner
    ========================== -->
    <section class="hero">

        <h2>Home</h2>

        <p>
            Ottawa West Hockey stat tracker
        </p>

        <a href="#news" class="cta-btn">
            Latest Scores
        </a>

    </section>


    <!-- =========================
         Main Content
    ========================== -->
    <div class="container" id="news">

        <!-- News -->
        <main class="news-section">

            <h3>Latest Scores</h3>

            <div id="news-container">
                <!-- Game news cards will be generated here -->
            </div>

        </main>


        <!-- Standings -->
        <aside class="sidebar">

            <h3>Stats</h3>

            <table>

                <thead>
                    <tr>
                        <th>Player</th>
                        <th>GP</th>
                        <th>G</th>
                        <th>A</th>
                        <th>P</th>
                    </tr>
                </thead>

                <tbody id="player-stats-body">
                    <!-- Player rows will be generated here -->
                </tbody>

            </table>

        </aside>

    </div>

    <div id="footer"></div>

</body>
    
<script>
    fetch("./components/navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("./components/footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

<script type="module" src="./js/main.js"></script>
    
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hockey Hub - ${gameName}</title>

    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>

    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">
        
        <span class="player-header-content">
            <a href="./" class="page-header-back">
                <img src="../icons/left-chevron.png" alt="Back to games" width="30" height="30">
            </a>

            <h2 id="game-name"></h2>
        </span>

    </section>

    <!-- =========================
         Main Content
    ========================== -->
    <main class="scores-container">

        <h3>Game Summary</h3>
        
        <div id="game-data"> <!-- Game data will be generated here --> </div>

    </main>

    <div id="footer"></div>

</body>
    
<script>
    fetch("../components/navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;

            const currentPath = window.location.pathname.replace(/\/+$/, "") || "/";

            document.querySelectorAll("#navbar nav a").forEach(link => {
                const linkPath = new URL(link.href).pathname.replace(/\/+$/, "") || "/";

                if (
                    linkPath === currentPath ||
                    (currentPath.endsWith("/players/player.html") && linkPath.endsWith("/players"))
                ) {
                    link.classList.add("active");
                }
            });
        });
</script>

<script>
    fetch("../components/footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

<script type="module" src="../js/main.js"></script>
    
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hockey Hub - Players</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!-- =========================
         Header & Navigation
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Test</h2>

    </section>

  <div id="results"></div>

  <script type="module">
    import { tallyPlayerGoals } from "./functions.js";

    async function loadGoals() {
      const response = await fetch("./data.json");
      const games = await response.json();

      const playerGoals = tallyPlayerGoals(games);

      console.log(playerGoals);

      const results = document.getElementById("results");

      Object.entries(playerGoals).forEach(([name, stats]) => {
        const player = document.createElement("div");

        player.innerHTML = `
          <h2>${name}</h2>
          <p>Goals: ${stats.goals}</p>
          <p>Post Goals: ${stats.postGoals}</p>
          <p>Total Goals: ${stats.totalGoals}</p>
        `;

        results.appendChild(player);
      });
    }

    loadGoals();
  </script>

<div id="footer"></div>
    
</body>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hockey Hub - Players</title>

    <style>
        /* =========================
           Global Styles
        ========================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f6f9;
            color: #333;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           Header & Navigation
        ========================== */
        header {
            background-color: #0d1b2a;
            color: #fff;
            padding: 1rem 2rem;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .logo span {
            color: #e63946;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #e63946;
        }

        /* =========================
           Page Header
        ========================== */
        .page-header {
            background:
                linear-gradient(
                    rgba(13, 27, 42, 0.85),
                    rgba(13, 27, 42, 0.85)
                ),
                url('https://images.unsplash.com/photo-1580748141549-71748dbe0bdc?auto=format&fit=crop&w=1600&q=80')
                no-repeat center center / cover;

            color: #fff;
            text-align: center;

            padding: 80px 20px;
        }

        .page-header h2 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 1.1rem;
        }

        /* =========================
           Players Section
        ========================== */
        .players-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .players-container h3 {
            border-bottom: 3px solid #0d1b2a;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* =========================
           Player Cards
        ========================== */
        .player-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .player-image {
            height: 220px;
            background-color: #0d1b2a;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;
            font-size: 3rem;
            font-weight: bold;
        }

        .player-info {
            padding: 20px;
        }

        .player-info h4 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .player-position {
            color: #e63946;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 10px;
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 1.2rem;
            color: #0d1b2a;
        }

        .stat span {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        /* =========================
           Footer
        ========================== */
        footer {
            background-color: #0d1b2a;
            color: #fff;

            text-align: center;

            padding: 20px;
            margin-top: 40px;
        }

        /* =========================
           Responsive Design
        ========================== */
        @media (max-width: 900px) {

            .players-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 10px;
            }

            nav ul {
                gap: 15px;
            }

            .page-header {
                padding: 60px 20px;
            }

            .page-header h2 {
                font-size: 2.2rem;
            }

            .players-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

  <!-- =========================
         Header & Navigation
    ========================== -->
    <header>

        <div class="logo">
            <h1>HOCKEY<span>HUB</span></h1>
        </div>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="players.html">Players</a>
                </li>

                <li>
                    <a href="test.html">Test</a>
                </li>
            </ul>
        </nav>

    </header>


    <!-- =========================
         Page Header
    ========================== -->
    <section class="page-header">

        <h2>Test</h2>

    </section>

  <div id="results"></div>

  <script type="module">
    import { tallyPlayerGoals } from "./functions.js";

    async function loadGoals() {
      const response = await fetch("./data.json");
      const games = await response.json();

      const playerGoals = tallyPlayerGoals(games);

      console.log(playerGoals);

      const results = document.getElementById("results");

      Object.entries(playerGoals).forEach(([name, stats]) => {
        const player = document.createElement("div");

        player.innerHTML = `
          <h2>${name}</h2>
          <p>Goals: ${stats.goals}</p>
          <p>Post Goals: ${stats.postGoals}</p>
          <p>Total Goals: ${stats.totalGoals}</p>
        `;

        results.appendChild(player);
      });
    }

    loadGoals();
  </script>

<div id="footer"></div>
    
</body>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>

<script>
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
</script>

</html>
